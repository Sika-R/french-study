name: Build Windows Release

# 触发条件：
#   1) 推送形如 v0.1.0 / v1.2.3 的 tag → 自动构建并发布到 GitHub Release
#   2) 手动在 Actions 页面点 "Run workflow" → 仅构建（不发布），用来测 yml 改动
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write   # 给 GITHUB_TOKEN 上传 release 资产的权限

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: french-deck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: french-deck/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Rebuild better-sqlite3 for Electron
        run: npm run rebuild

      - name: Build app + NSIS installer
        run: npm run dist
        env:
          # 关掉代码签名（没买证书；不影响功能，仅 SmartScreen 警告）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer as workflow artifact
        # 不论是 tag push 还是手动触发都上传，方便手动触发时下载
        uses: actions/upload-artifact@v4
        with:
          name: french-deck-windows-installer
          path: |
            french-deck/dist/*-setup-*.exe
            french-deck/dist/*.blockmap
          retention-days: 30

      - name: Publish to GitHub Release
        # 仅在 tag push 时跑
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # tag 自动从 github.ref 推断
          files: |
            french-deck/dist/*-setup-*.exe
            french-deck/dist/*.blockmap
          generate_release_notes: true   # 自动用 commit / PR 生成 release notes
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
